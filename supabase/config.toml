project_id = "mena-hardware"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Public sign-up is OFF: every signed-in user can read pricing. Add users from
# Studio / Dashboard -> Authentication -> Add user (or invite), then set their role in /users.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = false
enable_confirmations = false

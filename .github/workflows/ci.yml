name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-web:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:run

      - name: Build Production Bundle
        run: npm run build

      - name: Verify no service-role key in bundle
        run: |
          if grep -ri "service_role" dist/; then
            echo "ERROR: service_role reference detected in frontend bundle!"
            exit 1
          fi
